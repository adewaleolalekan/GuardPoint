# Cloudflare Tunnel config for GuardPoint.
#
# Copy to /etc/cloudflared/config.yml and replace <TUNNEL-ID>.
#
# Why a tunnel instead of an ALB / public IP:
#   * no inbound ports and no security-group holes — cloudflared dials out
#   * no certificate management; Cloudflare terminates TLS
#   * it gives us Cloudflare Access, which is the ONLY authentication in
#     front of this app (the application itself has none)

tunnel: guardpoint
credentials-file: /etc/cloudflared/<TUNNEL-ID>.json

ingress:
  # Public hostname. Gate it with a Cloudflare Access policy — see README.
  - hostname: guardpoint-test.waletech.org
    service: http://127.0.0.1:8000

  # Anything not matched above is refused rather than proxied.
  - service: http_status:404
